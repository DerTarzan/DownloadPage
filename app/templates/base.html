<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230866b2'/%3E%3Cpath d='M10 7h8l5 5v13H10z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/base.css">
  {% block styles %}{% endblock %}
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>
  <header class="site-header"><div class="wrap bar">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--primary)"/><path d="M10 7h8l5 5v13H10z" fill="none" stroke="var(--on-primary)" stroke-width="2" stroke-linejoin="round"/><path d="M13 17h7M13 21h7" stroke="var(--on-primary)" stroke-width="2" stroke-linecap="round"/></svg>
      <span>{{ site_name }}</span>
    </a>
    {% block nav %}<nav aria-label="Hauptnavigation"><a href="/">Start</a></nav>{% endblock %}
  </div></header>
  <main id="main" class="wrap">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><div class="wrap"><span>{{ site_name }}</span></div></footer>
  {% block chat %}{% if chat_enabled %}{% include "_chat.html" %}{% endif %}{% endblock %}
</body>
</html>
